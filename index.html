<style>
:root{
  --bg:#f3f7fc;--card:#fff;--text:#14213d;--muted:#566784;--line:#d3dff0;
  --brand:#0048ac;--brand-d:#00357f;--brand-l:#e6eefa;
  --ok:#12805c;--okbg:#e6f6ef;--bad:#b3261e;--badbg:#fdecea;--warn:#9a5b06;--warnbg:#fff4e0;
  --shadow:0 1px 3px rgba(0,72,172,.08),0 6px 18px rgba(0,72,172,.07);
}
*{box-sizing:border-box}
html,body,button,input,select,textarea{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{font-family:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:inherit;margin:0 0 .4em;line-height:1.25;color:var(--brand)}
h1{font-size:1.7rem}h2{font-size:1.35rem}h3{font-size:1.1rem}
.muted{color:var(--muted)}.hint{color:var(--muted);font-size:.9rem;text-align:center;margin:.9rem 0 0}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:6px;padding:1.25rem;box-shadow:var(--shadow)}
.wrap{max-width:1040px;margin:0 auto;padding:1rem}
.topbar{background:#fff;border-bottom:3px solid var(--brand);position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,72,172,.1)}
.topbar .in{max-width:1040px;margin:0 auto;padding:.45rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.7rem;font-weight:700;font-size:1.15rem;color:var(--brand);line-height:1.2}
.brand img{height:46px;width:auto;display:block}
.brand small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.banner{display:flex;align-items:center;gap:1.2rem;padding:.3rem 0 1rem;margin-bottom:1rem;border-bottom:1px solid var(--line)}
.banner img{width:auto;display:block}
.banner h2{margin:0}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end;margin-top:1rem}.row.between{justify-content:space-between}
.btn{font-size:1rem;border:1px solid var(--brand);background:#fff;color:var(--brand);padding:.42rem .95rem;border-radius:4px;cursor:pointer;font-weight:700}
.btn:hover{background:var(--brand-l)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-d)}
.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.danger:hover{background:var(--badbg)}
.btn.sm{padding:.18rem .6rem;font-size:.9rem}.btn.block{width:100%;margin-top:.6rem;padding:.6rem}
.btn.on{border-color:var(--warn);background:var(--warnbg);color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
label{display:block;font-weight:700;font-size:.95rem;margin:.75rem 0 0;text-align:left}
input,select,textarea{display:block;width:100%;margin-top:.3rem;font-size:1rem;color:var(--text);background:#fff;border:1px solid #b9c9e2;border-radius:4px;padding:.5rem .7rem}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
textarea{resize:vertical}
.login-wrap{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:1rem}
.login{width:100%;max-width:420px}
.login .lh{text-align:center}
.login .lh img{height:150px;width:auto;margin:0 auto .4rem;display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--brand-l);padding:4px;border-radius:6px;margin:1rem 0 .2rem}
.seg button{font-size:1rem;border:0;background:transparent;color:var(--brand);padding:.45rem;border-radius:4px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--brand);color:#fff}
.tabs{display:flex;gap:.2rem;flex-wrap:wrap;margin:0 0 1rem;background:var(--brand);padding:.35rem;border-radius:6px}
.tabs button{font-size:1rem;border:0;background:transparent;color:#fff;padding:.4rem .95rem;border-radius:4px;cursor:pointer;font-weight:700}
.tabs button:hover{background:rgba(255,255,255,.16)}
.tabs button.on{background:#fff;color:var(--brand)}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--brand-l);border-left:4px solid var(--brand);border-radius:4px;padding:.8rem 1rem}
.stat b{display:block;font-size:1.6rem;line-height:1.2;color:var(--brand)}.stat span{color:var(--muted);font-size:.9rem}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.55rem .7rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--brand);background:var(--brand-l);white-space:nowrap}
td.act{white-space:nowrap;text-align:right}
.badge{display:inline-block;padding:.05rem .55rem;border-radius:999px;font-size:.82rem;font-weight:700;background:var(--brand-l);color:var(--brand)}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.warn{background:var(--warnbg);color:var(--warn)}
.sp{margin-top:1rem}
.rules{padding-left:1.2rem}.rules li{margin:.35rem 0}
.timer{font-weight:700;font-size:1.25rem;padding:.15rem .75rem;border-radius:4px;background:var(--brand-l);color:var(--brand);font-variant-numeric:tabular-nums}
.timer.low{background:var(--badbg);color:var(--bad)}
.qtext{font-size:1.2rem;font-weight:700;white-space:pre-wrap;margin:.7rem 0 .9rem}
.opt{display:flex;gap:.7rem;align-items:flex-start;margin:.5rem 0;padding:.65rem .85rem;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:#fff}
.opt input{width:auto;margin:.2rem 0 0;display:none}
.opt .k{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--brand-l);color:var(--brand);display:grid;place-items:center;font-size:.9rem;font-weight:700}
.opt:hover{border-color:var(--brand)}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-l)}
.opt:has(input:checked) .k{background:var(--brand);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt.static{cursor:default}
.reason{margin-top:.6rem;padding:.65rem .85rem;border-left:4px solid var(--brand);background:var(--brand-l);border-radius:4px;font-size:.98rem;white-space:pre-wrap}
.qd{padding:1rem 0;border-bottom:1px solid var(--line)}.qd:last-child{border-bottom:0}
.exam{display:grid;grid-template-columns:1fr 290px;gap:1rem;align-items:start}
@media (max-width:820px){.exam{grid-template-columns:1fr}}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-bottom:.9rem}
.pb{font-size:1rem;font-weight:700;border:1px solid #d1d5db;background:#e5e7eb;color:#374151;border-radius:4px;padding:.3rem 0;cursor:pointer}
.pb.ans{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.pb.mark{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.pb.cur{outline:2px solid var(--brand);outline-offset:1px}
.legend{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.9rem;color:var(--muted);margin-top:.3rem}
.overlay{position:fixed;inset:0;background:rgba(0,30,80,.5);display:grid;place-items:center;padding:1rem;z-index:20;overflow-y:auto}
.modal{width:100%;max-width:520px;max-height:94vh;overflow-y:auto;margin:auto}
#toast{position:fixed;right:1rem;bottom:1rem;display:grid;gap:.5rem;z-index:30}
.toast{background:var(--brand-d);color:#fff;padding:.65rem 1rem;border-radius:4px;box-shadow:var(--shadow);max-width:340px}.toast.err{background:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:1.6rem}
.filters{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}.filters input,.filters select{margin:0;width:auto;min-width:160px}
.foot{text-align:center;color:var(--muted);font-size:.85rem;padding:1.2rem 1rem 2rem}
@media (max-width:600px){.topbar .in{flex-wrap:wrap}.banner{flex-direction:column;text-align:center}}
</style>
<style>
/* File pickers are opened programmatically by the Import buttons; never show them in the page footer. */
[hidden], input[type="file"][hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="quizFile" accept=".json,.txt,.csv,application/json,text/plain" hidden>

function toast(m,t){var d=document.createElement('div');d.className='toast '+(t||'');d.textContent=m;$('#toast').appendChild(d);setTimeout(function(){d.remove();},3600);}

function fmtDate(t){return new Date(t).toLocaleString();}
function fmtTime(s){s=Math.max(0,s|0);var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function normalise(){
  ['faculties','students','questions','results'].forEach(function(k){if(!Array.isArray(db[k]))db[k]=[];});
  db.questions.forEach(function(q){if(q.sec!==1&&q.sec!==2&&q.sec!==3)q.sec=1;});
}
function load(){
  try{db=JSON.parse(localStorage.getItem(KEY));}catch(e){db=null;}
  if(!db||!Array.isArray(db.admins)||!db.admins.length){db=seed();save();}
  normalise();
  try{var s=JSON.parse(sessionStorage.getItem(SKEY));if(s&&s.role&&s.id)session=s;}catch(e){}
}
function setSession(s){session=s;try{if(s)sessionStorage.setItem(SKEY,JSON.stringify(s));else sessionStorage.removeItem(SKEY);}catch(e){}}

/* ---------- lookups ---------- */
function facName(id){var f=db.faculties.filter(function(x){return x.id===id;})[0];return f?f.name:'(deleted)';}
function getStudent(){return db.students.filter(function(s){return session&&s.id===session.id;})[0];}
function getAdmin(){return db.admins.filter(function(s){return session&&s.id===session.id;})[0];}
var STATUS={completed:['Submitted','ok'],timeout:['Time up','warn'],closed:['Window closed','bad']};
function statusBadge(s){var x=STATUS[s]||[s,''];return '<span class="badge '+x[1]+'">'+esc(x[0])+'</span>';}
function bankCount(fid,sec){return db.questions.filter(function(q){return q.fid===fid&&q.sec===sec;}).length;}

/* ---------- auth ---------- */
function doLogin(v){
  var u=String(v.u||'').trim().toLowerCase(),p=String(v.p||'');
  var list=ui.role==='admin'?db.admins:db.students;
  var m=list.filter(function(x){return x.username.toLowerCase()===u&&x.password===p;})[0];
  if(!m){toast('Invalid username or password.','err');return;}
  ui.tab='dash';ui.viewResult=null;ui.adminResult=null;
  setSession({role:ui.role,id:m.id});render();
}
function logout(){setSession(null);exam=null;clearInterval(timerId);ui.viewResult=null;ui.adminResult=null;render();}

/* ---------- exam ---------- */
function buildPaper(fid){
  var out=[];
  PATTERN.sections.forEach(function(sc){
    var pool=db.questions.filter(function(q){return q.fid===fid&&q.sec===sc.n;});
    shuffle(pool).slice(0,sc.count).forEach(function(q){out.push(JSON.parse(JSON.stringify(q)));});
  });
  return out;
}
function startExam(){
  var s=getStudent();if(!s)return;
  if(s.attempted){toast('You have already taken the exam. Contact an administrator.','err');return;}
  var qs=buildPaper(s.fid);
  if(!qs.length){toast('No questions are available for your programme yet. Contact an administrator.','err');return;}
  s.attempted=true;save();
  exam={sid:s.id,qs:qs,i:0,answers:{},marked:{},start:Date.now(),end:Date.now()+PATTERN.minutes*60000,done:false};
  clearInterval(timerId);timerId=setInterval(tick,500);
  ui.viewResult=null;render();
}
function tick(){
  if(!exam)return;
  var left=Math.max(0,Math.ceil((exam.end-Date.now())/1000));
  var el=$('#timer');if(el){el.textContent=fmtTime(left);el.classList.toggle('low',left<=300);}
  if(left<=0)finishExam('timeout');
}
function finishExam(status,silent){
  if(!exam||exam.done)return;
  exam.done=true;clearInterval(timerId);
  var s=db.students.filter(function(x){return x.id===exam.sid;})[0];
  var sec={},score=0,correct=0,wrong=0,un=0;
  PATTERN.sections.forEach(function(sc){sec[sc.n]={score:0,max:0,c:0,w:0,u:0};});
  var details=exam.qs.map(function(q){
    var c=exam.answers[q.id];c=c===undefined?-1:c;
    var t=sec[q.sec];t.max+=PATTERN.mark;
    if(c===-1){t.u++;un++;}
    else if(c===q.answer){t.c++;t.score+=PATTERN.mark;correct++;score+=PATTERN.mark;}
    else{t.w++;t.score-=PATTERN.neg;wrong++;score-=PATTERN.neg;}
    return {sec:q.sec,text:q.text,options:q.options,chosen:c,answer:q.answer,reason:q.reason||''};
  });
  var max=details.length*PATTERN.mark;
  var r={id:uid(),sid:exam.sid,name:s?s.name:'',username:s?s.username:'',faculty:s?facName(s.fid):'',
    score:score,max:max,correct:correct,wrong:wrong,unanswered:un,sec:sec,total:details.length,
    pct:max?Math.round(score/max*1000)/10:0,date:Date.now(),
    secs:Math.min(Math.round((Date.now()-exam.start)/1000),PATTERN.minutes*60),status:status,details:details};
  db.results.push(r);save();exam=null;
  if(silent)return;
  ui.viewResult=r.id;render();
  toast(status==='timeout'?'Time is up. Your exam was submitted.':'Exam submitted.');
}
window.addEventListener('pagehide',function(){if(exam)finishExam('closed',true);});
window.addEventListener('beforeunload',function(e){if(exam){e.preventDefault();e.returnValue='';}});

function viewExam(){

/* ---- quiz file import (JSON from an AI tool, or pipe-separated text) ---- */
function parseSec(v){
  if(v==null||String(v).trim()==='')return null;
  var s=String(v).trim().toUpperCase();
  // Accept numeric/Roman section numbers, including labels with difficulty/text after them.
  var m=s.match(/(?:^|\b)(?:SECTION|SEC)\s*(III|II|I|[1-3])(?:\b|[.：:\s·—-])/);
  if(!m) m=s.match(/^\s*(III|II|I|[1-3])(?:\b|[.：:\s·—-])/);
  if(!m) return null;
  var n=m[1];
  return (n==='1'||n==='I')?1:(n==='2'||n==='II')?2:(n==='3'||n==='III')?3:null;
}
function parseAns(v,opts){
  if(typeof v!=='string')return -1;
  var s=v.trim(),low=s.toLowerCase(),i;
  for(i=0;i<4;i++){if(opts[i].toLowerCase()===low)return i;}
  var m=s.match(/^\(?([A-Da-d])\)?([.):\s]|$)/);
  return m?'ABCD'.indexOf(m[1].toUpperCase()):-1;
}
function parseQuizText(text){
  var items=[],bad=[];
  text=String(text||'').replace(/^﻿/,'').trim();
  function add(sec,q,opts,ans,reason,label){
    q=String(q==null?'':q).trim();
    if(!Array.isArray(opts)||opts.length!==4){bad.push(label);return;}
    opts=opts.map(function(x){return String(x==null?'':x).trim();});
    if(!q||opts.some(function(x){return !x;})){bad.push(label);return;}
    if(opts.every(function(o,i){return new RegExp('^\\(?'+'ABCD'[i]+'[.)]\\s*','i').test(o);}))opts=opts.map(function(o){return o.replace(/^\(?[A-Da-d][.)]\s*/,'');});
    var a=parseAns(ans,opts);
    if(a<0){bad.push(label);return;}
    items.push({sec:parseSec(sec),text:q,options:opts,answer:a,reason:String(reason==null?'':reason).trim()});
  }
  if(/^[\[{]/.test(text)){
    var o;
    try{o=JSON.parse(text);}catch(e){return {error:'This file is not valid JSON.'};}
    var arr=Array.isArray(o)?o:(o.questions||o.quiz||o.items);
    if(!Array.isArray(arr))return {error:'No question list found. Use a JSON array of questions.'};
    arr.forEach(function(it,i){
      if(!it||typeof it!=='object'){bad.push('#'+(i+1));return;}
      var opts=it.options||it.choices||it.answers;
      if(opts&&!Array.isArray(opts)&&typeof opts==='object')opts=['A','B','C','D'].map(function(k){return opts[k]!=null?opts[k]:opts[k.toLowerCase()];});
      var ans=it.answer!=null?it.answer:(it.correct!=null?it.correct:(it.correctAnswer!=null?it.correctAnswer:it.correct_answer));
      add(it.section!=null?it.section:it.sec,it.question||it.text||it.q,opts,ans,it.reason||it.explanation||it.rationale,'#'+(i+1));
    });
  }else{
    text.split(/\r?\n/).forEach(function(line,i){
      if(!line.trim())return;
      var p=line.split('|').map(function(x){return x.trim();});
      add(p[0],p[1],p.slice(2,6),p[6],p.slice(7).join('|'),'line '+(i+1));
    });
  }
  return {items:items,bad:bad};
}
function importQuizText(text){
  if(!db.faculties.length){toast('Add a programme first.','err');return;}
  var r=parseQuizText(text);
  if(r.error){toast(r.error,'err');return;}
  if(!r.items.length){toast('No valid questions found.'+(r.bad.length?' Problem entries: '+r.bad.slice(0,8).join(', ')+'.':''),'err');return;}
  var n=r.items.length,sk=r.bad.length;
  openForm('Import '+n+' question'+(n===1?'':'s')+' — CHECK DESTINATION PROGRAMME'+(sk?' ('+sk+' skipped: '+r.bad.slice(0,8).join(', ')+')':''),[
    {n:'fid',l:'DESTINATION PROGRAMME — SELECT CAREFULLY',t:'select',o:[['','⚠ Select destination programme…']].concat(fbtn()),v:''},
    {n:'distribution',l:'Questions without a section',t:'select',o:[['auto','Automatically distribute across Sections I, II and III (15 / 15 / 20 pattern)'],['one','Put all unsectioned questions in Section I']],v:'auto'}
  ],function(v){
    var counts={1:bankCount(v.fid,1),2:bankCount(v.fid,2),3:bankCount(v.fid,3)};
    var limits={1:15,2:15,3:20};
    var next=1,added=0;
    r.items.forEach(function(it){
      var sec=it.sec;
      if(!sec){
        if(v.distribution==='one')sec=1;
        else {
          // Fill each section's target capacity in order; explicit section labels are always respected.
          while(next<=3&&counts[next]>=limits[next])next++;
          if(next>3){
            // All target capacities are full; place any overflow in the least-filled section.
            sec=[1,2,3].sort(function(a,b){return counts[a]-counts[b];})[0];
          }else sec=next;
        }
      }
      db.questions.push({id:uid(),fid:v.fid,sec:sec,text:it.text,options:it.options,answer:it.answer,reason:it.reason});
      counts[sec]=(counts[sec]||0)+1;added++;
    });
    save();toast(added+' question(s) imported and assigned to sections.');
  });
}

  exportCsv:function(){
    var rows=[['Name','Username','Programme','Marks','Max marks','Correct','Wrong','Not attempted','Section I','Section II','Section III','Status','Date']].concat(db.results.map(function(r){
      return [r.name,r.username,r.faculty,fmtNum(r.score),r.max,r.correct,r.wrong,r.unanswered].concat(PATTERN.sections.map(function(sc){var t=r.sec&&r.sec[sc.n];return t?fmtNum(t.score):'';}),[r.status,fmtDate(r.date)]);
    }));
    download('gu-art-results.csv',rows.map(function(r){return r.map(csvCell).join(',');}).join('\r\n'),'text/csv');
  },
  exportJson:function(){download('gu-art-backup.json',JSON.stringify(db,null,2),'application/json');},
  importJson:function(){$('#importFile').click();},
  resetData:function(){confirmBox('Reset ALL data (students, questions, results, admins) to the sample data? This cannot be undone.',function(){db=seed();save();setSession(null);toast('Data reset. Please log in again.');},'Reset');}
};

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  var f=A[el.dataset.act];if(f)f(el.dataset,el);
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  var k=f.dataset.form,v={};
  new FormData(f).forEach(function(val,key){v[key]=val;});
  if(k==='login')doLogin(v);
  else if(k==='modal'){
    var cb=modalCb,err=cb&&cb(v);
    if(typeof err==='string'){toast(err,'err');return;}
    closeModal();render();
  }
});
document.addEventListener('input',function(e){
  var t=e.target;if(t.dataset&&t.dataset.live){ui[t.dataset.live]=t.value;render();}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.live){ui[t.dataset.live]=t.value;render();}
  else if(t.name==='opt'&&exam){setAns(parseInt(t.value,10));render();}
  else if(t.id==='quizFile'){
    var qf=t.files[0];if(!qf)return;
    var qr=new FileReader();
    qr.onload=function(){importQuizText(qr.result);};
    qr.readAsText(qf);t.value='';
  }
  else if(t.id==='importFile'){
    var file=t.files[0];if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var o=JSON.parse(rd.result);
        if(!o||!Array.isArray(o.admins)||!o.admins.length||!Array.isArray(o.questions)||!Array.isArray(o.students)||!Array.isArray(o.faculties))throw new Error('bad');
        db=o;normalise();save();setSession(null);toast('Backup imported. Please log in again.');render();
      }catch(x){toast('Invalid backup file.','err');}
    };
    rd.readAsText(file);t.value='';
  }
});

/* ---------- render ---------- */
function render(){
  var a=document.activeElement,id=a&&a.id,ss=a&&a.selectionStart,se=a&&a.selectionEnd;
  var h;
  if(session&&session.role==='student'&&!getStudent())setSession(null);
  if(session&&session.role==='admin'&&!getAdmin())setSession(null);
  if(!session)h=viewLogin();
  else if(session.role==='admin')h=viewAdmin();
  else if(exam)h=viewExam();
  else h=viewStudent();
  $('#app').innerHTML=h+'<div class="foot">Unofficial GU-ART practice tool. Not affiliated with Goa University.</div>';
  if(id){var n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(ss,se);}catch(e){}}}
  if(exam)tick();
}
load();render();
})();
</script>
